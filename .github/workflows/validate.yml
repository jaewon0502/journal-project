name: Validate public research
on:
  push:
    branches: [main, 'research/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research validation dependency
        run: python -m pip install -r requirements-research.txt
      - name: Offline artifact and regression checks
        run: python tools/run_checks.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reader test dependency
        run: npm ci --ignore-scripts
      - name: Reader interaction regressions
        run: npm test
