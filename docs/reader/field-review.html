<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실제 기사 검증 시간 · Journal</title><link rel="stylesheet" href="article-compare.css"><link rel="stylesheet" href="field-review.css"><script defer src="field-review-core.js"></script><script defer src="field-review.js"></script></head><body>
<header><strong>Journal</strong><nav><a href="editor-study.html">통제 실험</a></nav></header>
<main><h1>실제 기사 검증 시간</h1><p>원자료를 찾고, 근거 위치를 확인하고, 판정을 기록하는 시간을 각각 잽니다. 기사와 과제는 시작 후 확인할 수 있습니다.</p><noscript>JavaScript를 켜 주세요.</noscript>
<section class="panel" id="setup"><h2>과제 시작</h2>
<details id="case-import" open><summary>과제 파일 직접 불러오기</summary><label>참여자용 과제 파일 <input id="case-file" type="file" accept=".json,application/json"></label></details><p id="case-name" role="status"></p>
<label>배정받은 과제 <select id="task"></select></label><label>익명 참여 코드 <input id="participant" maxlength="64" autocomplete="off" placeholder="진행자가 배정한 코드"></label>
<label>배정 방식 <select id="method"><option value="manual">평소 검증 도구</option><option value="journal">평소 검증 도구와 저널</option></select></label>
<label>참여 구분 <select id="kind"><option value="practice">연습</option><option value="editor">현업 편집자·팩트체커 본인 참여</option></select></label>
<button id="start" class="primary" disabled>시간 측정 시작</button></section>
<section class="panel" id="work" hidden><h2 id="question"></h2><p id="article-link"></p><p id="tool-link"></p>
<fieldset><legend>현재 작업 단계</legend><div class="actions" id="phases"><button data-phase="search">원자료 찾기</button><button data-phase="locate">표·발언 위치 찾기</button><button data-phase="decide">판정 기록</button></div></fieldset>
<p class="note">단계를 바꿀 때 누르세요. 앞 단계로 돌아가면 그 단계에 시간이 더해집니다. 다른 탭에서 읽는 동안에도 시간이 흐릅니다.</p>
<label><input type="checkbox" id="total-only"> 단계 전환을 놓쳐 총시간만 사용</label>
<p id="clock" aria-live="off"></p><button id="pause">휴식</button>
<fieldset id="answer"><legend>검증 결과</legend>
<label>근거 위치 <select id="found"><option value="">선택하세요</option><option value="found">다시 찾을 수 있음</option><option value="missing">찾지 못함</option></select></label>
<label>원자료 주소 <input id="documentUrl" type="url" placeholder="https://"></label><label>정확한 위치 <input id="locator" placeholder="표 제목, 행·열, 기준연도 또는 발언 시각"></label>
<label>판정 <select id="verdict"><option value="">선택하세요</option><option value="supported">근거가 지지</option><option value="contradicted">근거가 반박</option><option value="insufficient">근거 부족</option></select></label>
<label>이 과제를 검증할 때 저널을 사용했습니까? <select id="journalUse"><option value="">선택하세요</option><option value="yes">사용함</option><option value="no">사용하지 않음</option></select></label>
<label>확인한 값과 이유 <textarea id="reason" rows="3"></textarea></label></fieldset>
<div class="actions"><button id="submit" class="primary">완료 기록</button><button id="withdraw">중도 종료</button></div></section>
<section class="panel" id="ended" hidden><h2>측정 기록</h2><p id="end-summary"></p><button id="download">참여 기록 JSON 저장</button><button id="next">새 과제</button></section>
<p id="status" role="status"></p><p id="storage-status" class="note" role="status" hidden></p></main></body></html>
